<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная работа 5 — Калькулятор</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="calc.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="site-header py-3 shadow-sm">
    <div class="container">
      <div class="d-flex flex-column flex-md-row align-items-center gap-3">
        <img id="logo" src="logo.png.png" alt="Логотип" width="80" height="80">
        <h1 class="site-title h2 m-0 text-center text-md-start">Лабораторная работа 5</h1>
      </div>
    </div>
  </header>

  <main class="container flex-grow-1 py-4">
    <section class="content-block calc-block p-3 p-md-4 rounded shadow-sm mx-auto">
      <h2 class="section-title pb-2 mb-4">Калькулятор стоимости заказа</h2>

      <form id="order-form" class="row g-3" novalidate>

        <div class="col-12">
          <label for="product" class="form-label fw-bold">Товар</label>
          <select id="product" name="product" class="form-select">
            <option value="100">наушники — 100 ₽</option>
            <option value="250">телефон — 250 ₽</option>
            <option value="500">ноутбук — 500 ₽</option>
            <option value="1200">планшет — 1200 ₽</option>
          </select>
        </div>

        <div class="col-12">
          <label for="quantity" class="form-label fw-bold">Количество</label>
          <input type="text" id="quantity" name="quantity" class="form-control"
                 inputmode="numeric" autocomplete="off"
                 placeholder="Введите целое число, например 5"
                 value="1" aria-describedby="error-message">
          <div id="error-message" class="text-danger mt-1" role="alert" hidden></div>
        </div>

        <div class="col-12">
          <button type="submit" id="calc-button" class="btn btn-save px-4 py-2">
            Посчитать стоимость
          </button>
        </div>

        <div class="col-12">
          <div id="result" class="result-box p-3 rounded" aria-live="polite"></div>
        </div>

      </form>
    </section>
  </main>

  <footer class="site-footer text-center py-4 mt-3">
    <div class="container">
      <p class="m-0">&copy; eveliwz</p>
    </div>
  </footer>

</body>
</html>
